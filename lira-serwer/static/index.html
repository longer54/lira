<style>
:root {
  --tlo: #050404; --panel: #0b0907; --panel2: #17120b; --linia: #33280f;
  --tekst: #f2e9d4; --szary: #a3957a; --zloto: #d9b05a; --zloto2: #f5d67e;
  --granat: #221a0b; --czerw: #e06c6c;   /* granat: dawna nazwa, teraz ciemne złoto (podświetlenia) */
  --zl: linear-gradient(135deg, #fff1b8 0%, #f0cf78 22%, #c8993f 45%, #8e6522 60%, #d4a94f 78%, #fbe6a2 100%);
  --zlPolysk: linear-gradient(100deg, #b8862e 0%, #f5d67e 20%, #fff4c4 25%, #d9b05a 35%, #8a6420 50%, #d9b05a 65%, #f5d67e 80%, #b8862e 100%);
  --zlLinia: linear-gradient(90deg, transparent, #8a6420 15%, #f5d67e 50%, #8a6420 85%, transparent);
  --szeryf: "Cinzel", "Cormorant Garamond", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--tlo); color: var(--tekst);
  font: 14px/1.4 "Inter", "Noto Sans", system-ui, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; }
.aplikacja { display: grid; height: 100vh; grid-template-rows: 56px 1fr 84px;
  grid-template-columns: 1fr 320px; grid-template-areas: "gora gora" "srodek kolejka" "gracz gracz"; }
@media (max-width: 900px) { .aplikacja { grid-template-columns: 1fr; grid-template-areas: "gora" "srodek" "gracz"; }
  .kolejka { display: none; } }

/* góra */
.gora { grid-area: gora; display: flex; align-items: center; gap: 12px; padding: 0 18px;
  border-bottom: 1px solid var(--linia); background: var(--panel); }
.logo { font-weight: 700; letter-spacing: .5px; color: var(--zloto); display: flex; gap: 8px; align-items: center;
  cursor: pointer; white-space: nowrap; }
.logo svg { width: 22px; height: 22px; }
.wstecz { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--szary); }
.wstecz:hover { background: var(--panel2); color: var(--tekst); }
.wstecz[hidden] { display: none; }
.szukaj { flex: 1; max-width: 560px; position: relative; }
.szukaj input { width: 100%; height: 38px; border-radius: 19px; border: 1px solid var(--linia);
  background: var(--tlo); color: var(--tekst); padding: 0 16px 0 40px; font: inherit; outline: none; }
.szukaj input:focus { border-color: var(--zloto); }
.szukaj svg { position: absolute; left: 13px; top: 10px; width: 18px; height: 18px; color: var(--szary); }

/* środek */
.srodek { grid-area: srodek; overflow-y: auto; padding: 22px 26px 40px; }
h2 { font-size: 19px; margin: 26px 0 12px; }
h2:first-child { margin-top: 0; }
.rzad { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
.kafel { flex: 0 0 160px; width: 160px; min-width: 0; cursor: pointer; }
.kafel .ok { width: 160px; height: 160px; border-radius: 8px; background: var(--panel2); object-fit: cover; position: relative; }
.kafel.wykonawca .ok, .kafel.kanal .ok { border-radius: 50%; }
.kafel.stacja .ok { object-fit: contain; padding: 18px; }
.kafel { position: relative; }
.u .plus.dp { color: var(--zloto2); opacity: 1; }
.utwory .u.od { grid-template-columns: 28px 44px 1fr auto auto auto; }
.kafel .gw { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%;
  background: #000a; color: var(--szary); font-size: 16px; display: none; place-items: center; }
.kafel:hover .gw, .kafel .gw.tak { display: grid; }
.kafel .gw.tak { color: var(--zloto2); }
.kafel .gw:hover { color: var(--zloto2); background: #000d; }
h2 .xzak { color: var(--szary); font-size: 13px; font-weight: 400; margin-left: 10px; }
h2 .xzak:hover { color: var(--czerw); }
.menuZak { position: fixed; background: var(--panel2); border: 1px solid var(--linia); border-radius: 10px; padding: 6px;
  min-width: 250px; box-shadow: 0 10px 30px #0008; z-index: 8; }
.menuZak button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 6px; }
.menuZak button:hover { background: var(--granat); }
.menuZak .opis { color: var(--szary); font-size: 12px; padding: 6px 12px; }
.menuZak input { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 8px 10px; border-radius: 6px;
  border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); }
.kafel .t { margin-top: 8px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kafel .p { color: var(--szary); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kafel:hover .ok { outline: 2px solid var(--zloto); }

.utwory { display: flex; flex-direction: column; }
.u { display: grid; grid-template-columns: 28px 44px 1fr auto auto; gap: 12px; align-items: center;
  padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.u:hover { background: var(--panel2); }
.u .nr { color: var(--szary); text-align: right; font-size: 12.5px; }
.u img, .u .brak { width: 44px; height: 44px; border-radius: 5px; object-fit: cover; background: var(--panel2); }
.u .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u .p { color: var(--szary); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u .czas { color: var(--szary); font-size: 12.5px; }
.u .plus { opacity: 0; color: var(--szary); width: 30px; height: 30px; border-radius: 50%; }
.u:hover .plus { opacity: 1; }
.u .plus:hover { color: var(--zloto); background: var(--tlo); }
.u.gra .t { color: var(--zloto); }

.naglowek { display: flex; gap: 24px; align-items: flex-end; margin-bottom: 22px; }
.naglowek img { width: 200px; height: 200px; border-radius: 10px; object-fit: cover; background: var(--panel2); }
.naglowek.wykonawca img, .naglowek.kanal img { border-radius: 50%; }
.naglowek h1 { margin: 0 0 6px; font-size: 30px; }
.naglowek .p { color: var(--szary); margin-bottom: 16px; }
.przycisk { background: var(--zloto); color: #1a1406; font-weight: 700; padding: 10px 22px; border-radius: 22px; }
.przycisk:hover { background: var(--zloto2); }
.przycisk.drugi { background: var(--panel2); color: var(--tekst); font-weight: 600; margin-left: 8px; }
.najlepszy { display: flex; gap: 18px; align-items: center; background: var(--panel); border: 1px solid var(--linia);
  border-radius: 12px; padding: 16px; max-width: 520px; cursor: pointer; }
.najlepszy img { width: 96px; height: 96px; border-radius: 8px; object-fit: cover; }
.najlepszy.wykonawca img { border-radius: 50%; }
.najlepszy .t { font-size: 20px; font-weight: 700; }
.najlepszy .p { color: var(--szary); }
.info { color: var(--szary); padding: 40px 0; text-align: center; }
.kreci { width: 28px; height: 28px; border: 3px solid var(--linia); border-top-color: var(--zloto); border-radius: 50%;
  animation: obrot 0.8s linear infinite; margin: 60px auto; }
@keyframes obrot { to { transform: rotate(360deg); } }

/* kolejka */
.kolejka { grid-area: kolejka; border-left: 1px solid var(--linia); background: var(--panel); display: flex;
  flex-direction: column; min-height: 0; }
.kolejka h3 { margin: 0; padding: 16px 18px 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--szary); }
.kolejka .utwory { overflow-y: auto; padding: 0 8px 20px; }
.kolejka .u { grid-template-columns: 40px 1fr auto; gap: 10px; padding: 5px 8px; }
.kolejka .u img, .kolejka .u .brak { width: 40px; height: 40px; }
.kolejka .u.biezacy { background: var(--granat); }
.kolejka .u.biezacy .t { color: var(--zloto2); }
.kolejka .u.bylo { opacity: .45; }

/* gracz */
.gracz { grid-area: gracz; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 1.4fr) minmax(0, 1fr);
  align-items: center; gap: 18px; padding: 0 18px; background: var(--panel); border-top: 1px solid var(--linia); }
.teraz { display: flex; gap: 12px; align-items: center; min-width: 0; }
.teraz img, .teraz .brak { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--panel2); flex: none; }
.teraz .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.teraz .p { color: var(--szary); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gracz { position: relative; }
.akcje { display: flex; gap: 2px; flex: none; }
.akcje button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--szary); }
.akcje button:hover { color: var(--tekst); background: var(--panel2); }
.akcje button.tak { color: var(--zloto2); }
.akcje svg { width: 20px; height: 20px; }
.menu.lewe { left: 18px; right: auto; bottom: 88px; max-height: 60vh; overflow-y: auto; }
.menu input { width: 100%; margin: 4px 0; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--linia);
  background: var(--tlo); color: var(--tekst); font: inherit; outline: none; }
.sterowanie { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.guziki { display: flex; gap: 14px; align-items: center; }
.guziki button { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--tekst); }
.guziki button:hover { color: var(--zloto2); }
.guziki .gg { width: 44px; height: 44px; background: var(--tekst); color: var(--tlo); }
.guziki .gg:hover { background: var(--zloto2); color: var(--tlo); }
.guziki svg { width: 22px; height: 22px; }
.pasek { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 12px; color: var(--szary); }
.pasek .os { flex: 1; height: 5px; background: var(--linia); border-radius: 3px; cursor: pointer; position: relative; }
.pasek .os div { height: 100%; background: var(--zloto); border-radius: 3px; width: 0; }
.pasek .os:hover { height: 7px; }
.prawo { display: flex; gap: 10px; justify-content: flex-end; align-items: center; position: relative; }
.prawo input[type=range] { width: 110px; accent-color: var(--zloto); }
.prawo .ikonka { color: var(--szary); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.prawo .ikonka:hover { color: var(--zloto2); background: var(--panel2); }
.menu { position: absolute; bottom: 52px; right: 0; background: var(--panel2); border: 1px solid var(--linia);
  border-radius: 10px; padding: 6px; min-width: 250px; box-shadow: 0 10px 30px #0008; z-index: 5; }
.menu button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 6px; }
.menu button:hover { background: var(--granat); }
.menu .opis { color: var(--szary); font-size: 12px; padding: 6px 12px; }
.baner { display: flex; gap: 14px; align-items: center; background: var(--granat); border: 1px solid #2d4170;
  border-radius: 12px; padding: 14px 18px; margin-bottom: 22px; }
.baner div { flex: 1; }
.baner b { color: var(--zloto2); }
.zakladka { color: var(--szary); padding: 8px 12px; border-radius: 18px; white-space: nowrap; font-weight: 600; }
.zakladka:hover, .zakladka.tak { color: var(--tekst); background: var(--panel2); }
.opisPodcastu { color: var(--szary); max-width: 760px; margin: -8px 0 18px; font-size: 13px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.konto { color: var(--szary); font-size: 12.5px; white-space: nowrap; }
.konto button { color: var(--szary); text-decoration: underline; }
.komunikat { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--granat);
  border: 1px solid var(--zloto); color: var(--tekst); padding: 10px 18px; border-radius: 10px; z-index: 9;
  box-shadow: 0 8px 24px #0009; transition: opacity .3s; }
.komunikat.blad { border-color: var(--czerw); }
.nowaWersja { position: fixed; left: 10px; right: 10px; top: 10px; z-index: 40; display: flex; gap: 12px; align-items: center;
  background: var(--granat); border: 1px solid var(--zloto); border-radius: 12px; padding: 12px 14px; box-shadow: 0 10px 30px #000a; }
.nowaWersja div { flex: 1; font-size: 13.5px; }
.nowaWersja b { color: var(--zloto2); }
.nowaWersja button { font-weight: 700; }
.nowaWersja .tak { background: var(--zloto); color: #1a1406; padding: 8px 14px; border-radius: 18px; }
/* „Graj na” */
.naUrz { display: none; }
.naUrz.inny { display: flex; }
.gracz .naUrz { position: absolute; left: 50%; transform: translateX(-50%); top: -26px; background: var(--zloto);
  color: #1a1406; font-size: 12px; font-weight: 700; padding: 3px 14px; border-radius: 12px 12px 0 0; gap: 6px; }
#bprzerzuc.inny { color: var(--zloto2); }
.urz { display: flex !important; gap: 12px; align-items: center; }
.urz .ik { font-size: 22px; width: 30px; text-align: center; }
.urz .n { font-weight: 600; }
.urz .o { color: var(--szary); font-size: 12px; }
.urz.tak .n, .urz.tak .o { color: var(--zloto2); }
.urz.off { opacity: .45; }
.urz.pod { padding-left: 28px; }
.wiersz { display: flex; align-items: center; gap: 4px; }
.wiersz > button.urz { flex: 1 1 auto; width: auto !important; min-width: 0; }
.wiersz > button.urz > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu .wiersz > button.razem, .arkusz .wiersz > button.razem, .wiersz > button.razem {
  display: grid; place-items: center; flex: 0 0 24px; width: 24px !important; height: 24px; padding: 0 !important;
  margin-right: 8px; border-radius: 50%; border: 1.5px solid var(--szary); background: transparent;
  color: transparent; font-size: 13px; line-height: 1; font-weight: 800; cursor: pointer; transition: .15s; }
.menu .wiersz > button.razem:hover, .wiersz > button.razem:hover { border-color: var(--zloto2); background: transparent; color: var(--zloto2); }
.menu .wiersz > button.razem.on, .arkusz .wiersz > button.razem.on, .wiersz > button.razem.on {
  background: var(--zloto); border-color: var(--zloto); color: #1a1406; }
.urz.pod .ik { font-size: 16px; }
.pobierz { color: var(--zloto2) !important; }

/* telefon: mini-odtwarzacz, dolne menu, pełny ekran — jak Spotify */
.mini, .dol, .pelny, .arkusz { display: none; }
@media (max-width: 700px) {
  html, body { font-size: 15px; }
  .aplikacja { height: 100dvh; grid-template-rows: auto 1fr auto auto; grid-template-areas: "gora" "srodek" "mini" "dol"; }
  .gracz, .kolejka, .gora .zakladka, .konto, .logo { display: none !important; }
  .gora { padding: 10px 12px; gap: 8px; border: 0; background: var(--tlo); padding-top: max(10px, env(safe-area-inset-top)); }
  .szukaj { max-width: none; }
  .szukaj input { height: 42px; border-radius: 10px; background: var(--panel2); border-color: transparent; font-size: 15px; }
  .srodek { padding: 8px 14px 24px; }
  h2 { font-size: 20px; margin: 22px 0 10px; }
  .kafel { flex: 0 0 136px; width: 136px; }
  .kafel .ok { width: 136px; height: 136px; }
  .kafel .gw { display: grid; }
  .u { grid-template-columns: 48px 1fr auto auto !important; gap: 12px; padding: 7px 4px; }
  .u .nr, .u .czas { display: none; }
  .u img, .u .brak { width: 48px; height: 48px; }
  .u .plus { opacity: .7; }
  .naglowek { flex-direction: column; align-items: flex-start; gap: 14px; }
  .naglowek img { width: 170px; height: 170px; align-self: center; }
  .naglowek h1 { font-size: 24px; }
  .najlepszy { max-width: none; }
  .komunikat { bottom: calc(140px + env(safe-area-inset-bottom)); max-width: 90vw; }
  .menuZak { left: 12px !important; right: 12px; min-width: 0; }

  .mini { grid-area: mini; display: block; margin: 0 8px 6px; border-radius: 10px; overflow: hidden; position: relative;
    background: var(--mini, #2a2f3c); transition: background .6s; }
  .mini[hidden] { display: none; }
  .mini .w { display: flex; align-items: center; gap: 10px; padding: 8px; }

function kolorOkladki(url) {   // tło mini-odtwarzacza w kolorze okładki (jak Spotify)

    for (let i = 0; i < d.length; i += 4) { const m = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
      const w = 1 + (m - mn) / 40; r += d[i] * w; g += d[i + 1] * w; b += d[i + 2] * w; n += w; }
    const f = v => Math.round(v / n * .55);
    document.documentElement.style.setProperty("--mini", `rgb(${f(r)},${f(g)},${f(b)})`);
  } catch { document.documentElement.style.removeProperty("--mini"); } };
  img.onerror = () => document.documentElement.style.removeProperty("--mini");
  img.src = url;
}

  }
}
function otworzPelny() { $("#pelny").hidden = false; history.pushState({ pelny: 1 }, ""); }
function zamknijPelny() { if (!$("#pelny").hidden) { $("#pelny").hidden = true; } }
function arkusz(co) {
  const a = $("#arkusz"); a.dataset.co = co; a.hidden = false;
  rysujArkKolejke();
}
function rysujArkKolejke() {
  $("#arkT").innerHTML = `<h3>Kolejka</h3><div class="utwory">${$("#kolejka").innerHTML}</div>`;
  setTimeout(() => $("#arkT .biezacy")?.scrollIntoView({ block: "center" }), 30);
}
function zamknijArkusz() { $("#arkusz").hidden = true; }
$("#arkusz").addEventListener("click", e => {
  if (e.target === $("#arkusz")) return zamknijArkusz();
  const x = e.target.closest("[data-usun]");
  if (x) { e.stopPropagation(); return steruj("/api/usun", { indeks: +x.dataset.usun }).then(rysujArkKolejke); }
  const u = e.target.closest(".u[data-i]"); if (u) { steruj("/api/skocz", { indeks: +u.dataset.i }); zamknijArkusz(); }
});
$("#mini").addEventListener("click", e => {
  if (e.target.closest("#miniGraj")) return steruj("/api/przelacz");
  otworzPelny();
});
$("#pZamknij").onclick = () => history.back();
$("#pGraj").onclick = () => steruj("/api/przelacz");
$("#pDalej").onclick = () => steruj("/api/dalej");
$("#pWstecz").onclick = () => $("#bwstecz").click();
$("#pKolejka").onclick = $("#pKolejka2").onclick = $("#pNast").onclick = () => arkusz("kol");
$("#pDp").onclick = e => { e.stopPropagation(); const u = STAN?.utwor; if (u?.videoId) menuList(e.currentTarget, u); };
$("#pPolub").onclick = async () => {
  const u = STAN?.utwor; if (!u) return;
  if (u.radio) { await gwiazdka({ typ: "stacja", tytul: u.stacja, url: u.url, okladka: u.okladka, rid: typeof u.radio === "string" ? u.radio : null }); return rysujTelefon(); }
  try { await api("POST", "/api/polub", { videoId: u.videoId, tak: !u.polubiony });
    komunikat(u.polubiony ? t("Usunięte z polubionych") : t("Dodane do polubionych ♥")); navigator.vibrate?.(15); odswiez(); }
  catch (err) { komunikat(err.message, true); }
};
$("#pOs").addEventListener("input", e => {
  pOsTrzymany = true; const dl = STAN?.utwor?.dlugosc || 0;
  $("#pPoz").textContent = czas(e.target.value / 1000 * dl);
});
$("#pOs").addEventListener("change", e => {
  const dl = STAN?.utwor?.dlugosc || 0; pOsTrzymany = false;
  if (dl) steruj("/api/przewin", { sekunda: Math.round(e.target.value / 1000 * dl) });
});
// gesty: okładka w bok = następny/poprzedni, ekran w dół = zwiń
let dotyk = null;
$("#pelny").addEventListener("touchstart", e => { if (e.target.closest("input")) return; dotyk = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }; }, { passive: true });
$("#pelny").addEventListener("touchend", e => {
  if (!dotyk) return; const dx = e.changedTouches[0].clientX - dotyk.x, dy = e.changedTouches[0].clientY - dotyk.y; const naOkl = !!e.target.closest("#pOkl"); dotyk = null;
  if (dy > 110 && Math.abs(dx) < 80) return history.back();
  if (naOkl && Math.abs(dx) > 60 && Math.abs(dy) < 60) {
    const img = $("#pOkl img, #pOkl .brak"); if (img) { img.style.transform = `translateX(${dx > 0 ? 40 : -40}px)`; img.style.opacity = .3;
      setTimeout(() => { img.style.transform = ""; img.style.opacity = ""; }, 260); }
    navigator.vibrate?.(10);
    return dx < 0 ? steruj("/api/dalej") : steruj("/api/dalej", { wstecz: true });
  }
});
window.addEventListener("popstate", () => { zamknijArkusz(); zamknijPelny(); });
$("#dol").addEventListener("click", e => {
  const b = e.target.closest("[data-nav]"); if (!b) return;
  const n = b.dataset.nav;
  if (n === "szukaj") { document.querySelectorAll("#dol button").forEach(x => x.classList.toggle("tak", x === b)); $("#q").focus(); $("#q").select(); return; }
  historia.length = 0; pokaz({ typ: n }, false); $("#wstecz").hidden = true;
});
// przycisk „wstecz” Androida (appka woła window.wstecz()): arkusz → pełny ekran → poprzedni widok
window.wstecz = () => {
  if (!$("#arkusz").hidden) { zamknijArkusz(); return true; }
  if (!$("#pelny").hidden) { history.back(); return true; }
  if (document.querySelector(".menuZak")) { document.querySelector(".menuZak").remove(); return true; }
  if (historia.length) { pokaz(historia.pop(), false); return true; }
  return false;
};
odswiez().then(() => pokaz({ typ: "start" }, false));
</script>
