[package]
name = "muzyka-zasobnik"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "muzyka-zasobnik"
path = "src/main.rs"

[dependencies]
ksni = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }

[profile.release]
opt-level = 2
